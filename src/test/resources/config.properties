# ================= Environment =================
# qa | sit | uat. Each has its own file in environments/ with the URL, data sheet and
# other values that differ per environment. Override per run: mvn test -Denv=uat
env=qa

# ================= Browser =================
# chrome | edge | firefox
browser=chrome
headless=false

# Private browsing: Chrome incognito, Edge InPrivate, Firefox private window.
# private.mode applies to every browser. A browser-specific key, when set, wins over it.
private.mode=false
chrome.private.mode=
edge.private.mode=
firefox.private.mode=

# Extra command-line arguments per browser, comma-separated
# e.g. chrome.args=--disable-extensions,--lang=en-US
chrome.args=
edge.args=
firefox.args=

# ================= Tags =================
# Run only tests whose Jira ID or group matches, comma-separated. Empty runs everything.
# Usually passed on the command line instead: -Dtags=nanditha-0345,nanditha-0346  or  -Dtags=smoke
tags=

# ================= Execution =================
# local | browserstack
execution=local

# ================= Timeouts (seconds) =================
explicit.wait=10
page.load.timeout=30

# ================= MFA =================
# Prefer the MFA_SECRET environment variable. Leave this blank in the repo.
mfa.secret=

# ================= Email OTP =================
# Mailbox that receives one-time codes.
#   imap  - Gmail or any IMAP mailbox. Password from the EMAIL_PASSWORD env variable (Gmail: an app password).
#   graph - Outlook / Microsoft 365. Uses GRAPH_TENANT_ID, GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET env variables.
email.provider=imap
email.imap.host=imap.gmail.com
email.imap.port=993
email.username=
# INBOX for IMAP, inbox for Graph
email.folder=INBOX

# ================= Reporting =================
screenshot.on.failure=true

# Any value above can be overridden at run time, e.g.
#   mvn test -Dbrowser=edge -Dprivate.mode=true -Dheadless=true
